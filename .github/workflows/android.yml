# Android APK 构建。只在 main 上和手动触发时跑（约 15-25 分钟），不挡 PR。
# openfl 的 android 构建在 Linux 上即可（hxcpp + gradle），不需要 Windows。
# 首次跑通（H1）后按实际调整 SDK/NDK 版本和 APK 路径。
name: android

on:
  push:
    branches: [main]
    # 纯配置/文档推送不跑 15-25 分钟的 NDK 构建（2026-11-19：yaml-only 提交
    # 也在全量跑，白烧一遍还撞基建抖动）。混入代码改动的推送不受影响。
    # 注意只在这里加：web.yml 挡着流水线的 required_checks，加了 ignore 后
    # 「sync 合并只带来 handbook/.orchestrator」这类推送会触发 NoCIStarted
    # 停人工（编排器 #199）。
    # 2026-11-22 扩充：spec/（规格 JSON）、scripts/（注意 sync-legacy-assets.sh
    # 也在此目录——改它时若无 src/asset 同动，本 CI 跳过、由 web.yml 的构建
    # 兜底验证）、legacy/decompiled + recompile-trigger（反编译基线，非构建
    # 输入）、harness/checks（流水线与 web 冒烟基建）、tools（独立 haxelib
    # 工具，不进 APK——Project.xml 的 source 只有 src/）。构建输入白名单：
    # src/、Project.xml、libraries.xml、assets/legacy-assets.txt、
    # legacy/deploy/（sync 的资产源）。
    paths-ignore:
      - ".orchestrator/**"
      - "handbook/**"
      - "**.md"
      - "spec/**"
      - "scripts/**"
      - "legacy/decompiled/**"
      - "legacy/deploy/recompile-trigger"
      - "harness/**"
      - "checks/**"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  SDK_PLATFORM: "platforms;android-34"
  BUILD_TOOLS: "build-tools;34.0.0"
  NDK_VERSION: "26.3.11579264"
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/26.3.11579264

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # GitHub runner 到 Ubuntu 镜像（azure.archive/security.ubuntu.com）有
      # 瞬时抖动：connection timed out / select(11)（2026-11-19 实测红过两轮
      # workflow）。apt 全局重试，覆盖本文件和子进程（playwright 等）的 apt。
      - name: apt 重试配置
        run: echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries

      - name: 安装 haxe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends haxe

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # Gradle 依赖缓存：Maven Central 对 CI 突发流量会 429（2026-11-19 实测
      # error_prone_annotations 拉不下来）。依赖组稳定，固定 key 永久复用；
      # 换 gradle 插件版本时 bump key。
      - name: 缓存 Gradle 依赖
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ runner.os }}-v1

      - name: 安装 Android SDK/NDK
        run: |
          set -eu
          sdkmgr=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          [ -n "$sdkmgr" ] || { echo "找不到 sdkmanager（cmdline-tools 未安装）"; exit 1; }
          yes | "$sdkmgr" --licenses > /dev/null || true
          "$sdkmgr" --install "$SDK_PLATFORM" "$BUILD_TOOLS" "platform-tools" "ndk;${NDK_VERSION}"

      - name: 缓存 haxelib
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: haxelib-android-${{ hashFiles('.github/workflows/android.yml') }}

      - name: 同步资产副本（assets/legacy/ 不入库，构建时生成）
        run: bash scripts/sync-legacy-assets.sh

      - name: 构建 APK
        run: |
          haxelib setup "$HOME/haxelib"   # 注意 ~/.haxelib 是 haxelib 的配置文件路径，不能当仓库
          haxelib install lime 8.3.2   # haxelib install 不装依赖，lime 必须显式装
          # android 目标要编译 C++：用 libhxcpp（hxcpp 的继任者，支持新 NDK 布局）。
          # 老的 hxcpp 4.3.2 在 NDK 26 下编 PCH 报 'typeinfo' file not found。
          # setup 之后，引用 hxcpp 的库（openfl/lime）自动解析到 libhxcpp。
          haxelib install libhxcpp 6.0.0-rc.2
          haxelib run libhxcpp setup
          haxelib install openfl 9.5.2
          haxelib install swf 3.4.0
          # lime 的 Android 环境用非交互方式写进配置（lime setup 是交互式的）。
          # ANDROID_SETUP 标记不可少：lime 的 AndroidPlatform 构造时就检查它（lime 官方 CI 同款做法）。
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_ROOT"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true
          # -debug（2026-11-24 起真机验收期）：hxcpp 只在 debug 配置编入
          # HXCPP_STACK_TRACE 异常栈采集，release 下闪退日志只有一行消息没有
          # Called from 栈（#10 真机 Invalid field:x 靠 455 候选静态排除的教训）。
          # 验收期结束是否回 -release 由人再定。
          haxelib run openfl build android -debug

      - name: 找 APK
        id: apk
        run: |
          apk=$(find export/android -name '*.apk' -type f | head -1)
          [ -n "$apk" ] || { echo "没找到 APK（openfl 产出的目录可能不同，调整本步骤的查找路径）"; exit 1; }
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 14
