# pipeline:spec —— 从 legacy/ 提取规格到 spec/（协议、数值、交互、模块清单）。
# 只能改 spec/，由另一个模型审核后自动合并；合并后的 spec/ 在其他流水线里只读。
version: 1
base: main
agent_dockerfile: agent.Dockerfile
required_checks: []
protected: [legacy/, checks/, scripts/, harness/, ci/, .github/, "*.md", Project.xml, "*.hxml"]
suites:
  spec: { cmd: "bash checks/spec-valid.sh", timeout: 2m }
  manifest: { cmd: "bash checks/manifest-valid.sh", timeout: 2m }
preflight: [manifest]
budget: { max_runs: 12, max_time: 6h }
stages:
  - id: extract
    kind: agent
    model: strong
    prompt: prompts/spec.md
    # 300/90m（2026-11-21 对齐默认流水线 write-tests 的证据口径）：同为 strong
    # 模型的大读大写阶段，#7 实测 174 calls 贴 160 上限后调的 300。S4 在旧值
    # 200/60m 内过，但 S1（全部 mod 的参数/字段）/S3（两 swf 全部监听）的
    # 提取量不低于 write-tests 大模块的写作量——无人值守连跑等撞墙再调就是
    # 白烧一轮（#7 教训）。
    max_turns: 300
    timeout: 90m
    allowed_paths: ["spec/"]
    verify: [spec]
    ci: local
    attempts: 3
    escalate: { after: 2, models: [strong2] }
  - id: review-spec
    kind: review
    model: judge
    prompt: prompts/review-spec.md
    max_turns: 120
    on_reject: extract
    max_rejects: 4
    escalate: { after: 2, models: [judge2] }
  # 规格由另一个模型审核后自动合并。标 unknown 的条目和 approved:false 的默认决定
  # 留到 95% 验收时由人看。
  - id: merge
    kind: merge
    method: squash
    # 规格文件的体量由 legacy 语料决定（S4：805 类 13875 行；S1 协议 / S2 数值
    # 会更大），不是范围失控信号——像默认流水线对 test/** 一样不计行数。
    # 范围控制靠 allowed_paths（只准 spec/）+ review-spec 审内容 + 文件数上限
    # （一个模块一个文件，逼着结构规整）。
    exclude_from_limits: ["spec/**"]
    max_changed_lines: 8000
    max_changed_files: 30
    # 同模型审核放行（2026-11-17 决定，同 pipeline.yaml/chore.yaml；单模型 API
    # 下 distinct reviewer 永远过不了，规格流水线当时漏改）。
    require_distinct_reviewer: false
    allowed_paths: ["spec/"]
