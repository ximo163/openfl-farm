# openfl-farm 默认流水线：翻译一个模块，先写测试再翻译实现。
#
#   write-tests (strong) -> review-tests (judge) -> implement (cheap) -> review-impl (judge) -> merge
#
# 写不出失败测试的任务走别的流水线，打对应标签：
#   pipeline:spec   从 legacy/ 提取规格到 spec/
#   pipeline:chore  脚手架、依赖、配置（如 V1 资产通道探路）
#   pipeline:plan   大需求先拆分
#
# 环境边界（用户要求，也是 CLAUDE.md 的规则）：容器里只做轻量验证——haxe 编译
# （html5 目标，不需要浏览器/NDK/SDK）和 eval 单测。需要 Java（FFDec）、Docker
# （旧后端）、无头浏览器（冒烟/截图/资产比对）、Android 工具链（APK）的都在
# GitHub CI：implement 开 PR 后等 web-build、web-smoke。
# 画面保真是硬需求：T2（逐资产渲染比对）跑通后把 visual-diff 加进 required_checks，
# 此后视觉跑偏的 PR 不能合并。
version: 1
base: main
agent_dockerfile: agent.Dockerfile
required_checks: [web-build, web-smoke]   # .github/workflows/web.yml 的 job；T2 后加 visual-diff

protected:
  - legacy/            # 原版部署包、manifest、反编译结果、行为轨迹：只读
  - spec/              # 规格：由 pipeline:spec 提取、人审核
  - checks/            # 校验脚本：人写
  - scripts/           # 反编译、资产同步等脚本：人管
  - harness/           # 自动验收：agent 不能改
  - ci/
  - .github/
  - "/*.md"            # 根目录不写文档（给人看的在 openfl-farm-docs）。handbook/ 是给
                       # agent 的工作手册（2026-11-19 所有者决定），放开让它边实现边补
  - Project.xml        # OpenFL 工程配置（library 声明等）由人管
  - "*.hxml"

# assets/legacy/ 是从 legacy/deploy/ 按清单拷贝的生成物。agent 只改
# assets/legacy-assets.txt（清单），流水线每次 agent 运行后自动重新同步。
generated:
  paths: ["assets/legacy/"]
  how: "把要引用的资产路径加进 assets/legacy-assets.txt，然后运行 bash scripts/sync-legacy-assets.sh"
  cmd: "bash scripts/sync-legacy-assets.sh"

budget:
  max_runs: 30
  # 12h（2026-11-20 从 8h 调）：#8（V3b 视图层片）8h3m 撞墙，停在 review
  # round 3 驳回后的收敛尾巴上——剩余工作是补 handbook 节这个量级。视图层
  # 片（web-smoke 崩溃排查 + 测试往返）一轮就是这个量级，#9/#10 同类。
  max_time: 12h
max_jumps: 3

suites:
  manifest: { cmd: "bash checks/manifest-valid.sh", timeout: 2m }
  # 全量编译检查：翻译错误的第一道网。html5 目标只需 haxe + haxelib（镜像里已装）。
  compile: { cmd: "haxelib run openfl build html5", timeout: 10m }
  # 单元测试：utest + eval 解释器，秒级。test.hxml 里失败时以非零退出码结束。
  test: { cmd: "haxe test.hxml", timeout: 5m }
  # JSON 解析只许走 as3corelib 门面（宽松语义 + 串内控制字符消毒）：直连
  # haxe.Json.parse 在真后端数据上红 CI（#7 web-smoke 两轮），自编 fixture
  # 查不出来，这个 2 秒的 grep 在容器里就拦住。
  json-facade: { cmd: "bash checks/json-facade-only.sh", timeout: 2m }
  # test 树卫生机器门（issue #70，#56 import.hx 遮蔽事故的机械化收口）：
  # 判式/豁免/坑见 handbook/architecture/test-tree-gates.md。python3 不是
  # python——agent 容器没有 python 别名，照 python 接线 verify 直接 127。
  # 接线由人完成：.orchestrator/ 在编排器阶段合同里硬编码保护（配置层
  # pipeline.yaml 的 protected: 不含它，两层以合同层为准），agent 不可写。
  test-stub-scan: { cmd: "python3 tools/scan_test_stubs.py", timeout: 1m }
  module-path-scan: { cmd: "python3 tools/scan_module_paths.py", timeout: 1m }

preflight: [manifest, compile, test, json-facade]   # test 无 junit，靠退出码做 expect: fail 基线

# 以后加上（工具/规格合并后再写进来）：
#   port-coverage: bash checks/port-coverage.sh    spec/modules 的类 vs src/ 的移植类对账
#   asset-refs:    haxe --run tools/AssetRefs      资产引用与 swf-inventory 对账

stages:
  - id: write-tests
    kind: agent
    model: strong
    prompt: prompts/write-tests.md
    # 300 turns / 90m：issue #7 a1 实测 174 次调用（39.8m）已贴 160 上限，a3 补
    # FarmLandModel 公式等三块测试时直接 error_max_turns 截断。测试面覆盖大模块
    # （2071 行类）时写作量和 implement 同量级，预算对齐 implement 的思路。
    max_turns: 300
    timeout: 90m
    verify:
      - compile                       # 测试和 stub 能编译
      - json-facade                   # 测试引入的 src 改动也不许绕过 JSON 门面
      - { suite: test, expect: fail } # 新测试在实现之前失败（靠退出码判定）
      - test-stub-scan                # #70 机器门：stub 错放 test/ 当场拦（#56 教训）
      - module-path-scan              # #70 机器门：跨树重复模块路径即遮蔽风险
    attempts: 4
    escalate: { after: 2, models: [strong2] }

  - id: review-tests
    kind: review
    model: judge
    prompt: prompts/review-tests.md
    max_turns: 120
    on_reject: write-tests
    max_rejects: 5
    escalate: { after: 3, models: [judge2] }

  - id: implement
    kind: agent
    model: cheap
    prompt: prompts/implement.md
    # 1000（2026-11-19 用户决定）：#7 implement 两轮都在 400 撞 error_max_turns
    # （第二轮 401 turns / 1h21m / $14.15 收尾时闭包仍未写完）——成规模的模块
    # 翻译一轮写完就是这个量级。
    max_turns: 1000
    # 240m 与 1000 turns 配套：实测 4.5~5 次调用/分钟，120m 只容 ~550 次，
    # 不放时间的话轮次上限永远不会生效（issue #3 attempt-1 就是被时间墙
    # 杀掉过没写完的会话）。
    timeout: 240m
    protect_since: write-tests
    append_only: ["test/**"]
    protected: ["test/fixtures/"]
    verify: [compile, test, json-facade, test-stub-scan, module-path-scan]   # 后两个：#70 机器门
    ci: true    # 开 PR 并等 required_checks：html5 构建和冒烟在 GitHub 上
    attempts: 4
    escalate: { after: 2, models: [strong, strong2] }
    on_exhausted: write-tests

  - id: review-impl
    kind: review
    model: judge
    prompt: prompts/review-impl.md
    # 和 implement 的 verify + CI 等待并行（#224）：implement 一 push 审核就
    # 开跑，省掉 CI 等 6-7 分钟的串行干等（#7 终轮实测 CI 6m41s + 审核 3m13s
    # 纯串行）。代价：CI 红时这轮审核作废（token 照花、不算驳回）——json 控
    # 制字符/库漏报这两类高频 CI 红已有 json-facade 和启动库门禁拦在容器里，
    # 剩余风险主要是 web-smoke 的渲染问题，绿面大。
    during_verify: true
    # 200：#3 的 review-impl 实测 105/120 调用（87% 水位）审 6.8k 行 diff，
    # #7 起的模块 diff 更大，120 必撞 error_max_turns。
    max_turns: 200
    on_reject: implement
    on_reject_tests: write-tests
    max_rejects: 5
    escalate: { after: 3, models: [judge2] }

  # 审核通过、检查全过后自动 squash 合并。超出范围的 PR 留着并说明原因，不强行合并。
  # 不做前置规模评估（triage 已删，2026-11-18 用户决定：提 issue 时人已定好规模）；
  # 这里的上限是最后防线——超限只是停下等人工合并，不烧模型轮次。
  - id: merge
    kind: merge
    method: squash
    exclude_from_limits: ["test/**", "handbook/"]
    # 2026-11-20 从 8000/60 放宽到 20000/250（用户决定，为了无人值守连夜跑）：
    # 模块切片 PR 实测 5-14k 计数行 / 89-181 计数文件（#7 12005/181、#8 89
    # 文件），旧上限每片都停人工合并、夜里卡死。新值给 #9（qui 子集 + 飘字/
    # 光标）留足余量，仍是失控保险丝——正常切片的三倍才会停下等人工。
    max_changed_lines: 20000
    max_changed_files: 250
    # 同模型审核放行（用户决定 2026-11-17）：单模型 API 下 distinct reviewer 永远
    # 过不了。审查仍是独立会话 + 独立 judge 提示词，靠「实现/审查不同提示词」防放水。
    require_distinct_reviewer: false
    allowed_paths:
      - src/
      - assets/legacy-assets.txt
      - libraries.xml
      - test/
      - tools/
      - handbook/
