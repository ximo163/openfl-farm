# pipeline:plan —— 大需求先拆分（拆分阶段必须是一条流水线里唯一的阶段）。
version: 1
base: main
agent_dockerfile: agent.Dockerfile
required_checks: []
protected: [legacy/, spec/, checks/, scripts/, harness/, ci/, .github/, "*.md", Project.xml, "*.hxml"]
suites: {}
preflight: []
budget: { max_runs: 8, max_time: 4h }   # ≥ 3 attempts × 90m 的最坏情况（2026-11-21 与 turn 上限配套调）
stages:
  - id: plan
    kind: plan
    model: strong
    prompt: prompts/plan.md
    # 200/90m（2026-11-21）：#22 pasture 拆分要读 350 类的 spec/modules/
    # pasture.json 全清单再产出拆分评论，读量与默认流水线 write-tests 的大
    # 模块同级（那里 300/90m 是 #7 实测调出来的）。旧值 120/60m 从未跑过，
    # 无人值守下不留未校准的短板。
    max_turns: 200
    timeout: 90m
    # attempts/escalate 不写也写不得：编排器校验把 plan 阶段上的这两个键当
    # ConfigError 拒绝（orchestrator-agent internal/pipeline/project.go 的
    # planNoEffectProblems，其 issue #32）——plan 阶段永远走默认 3 次尝试
    # （AttemptsOr），用尽转 needs-human，没有 escalate 通道。2026-11-26
    # #22 首跑即 invalid 才发现；这两个键从骨架（ce776324）起就一直无效。
