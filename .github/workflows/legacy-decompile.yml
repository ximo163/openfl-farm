# 反编译主代码 swf（要 Java + FFDec，重操作走 CI）：
#   1. 5 个主代码 swf 全量导出到 legacy/decompiled/（scripts/decompile-legacy.sh）
#   2. 6290 个资产 swf 生成清单 spec/swf-inventory.json（scripts/swf-inventory.py）
#   3. 有变化就提交（[skip ci] 防循环触发）
# 触发：特意改 legacy/deploy/recompile-trigger（升级 FFDec / 改反编译脚本后重建
# 基线），或手动。原版包只读、swf 不会自己变——盯整个 legacy/deploy/** 会被
# README/build.sh 之类的改动误触，白跑 20-40 分钟还刷出时间戳 churn。
name: legacy-decompile

on:
  push:
    paths: ["legacy/deploy/recompile-trigger"]
  workflow_dispatch:

permissions:
  contents: write   # 提交反编译产物

concurrency:
  group: legacy-decompile

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 下载 FFDec（版本钉死：升级要同时改这里和 recompile-trigger）
        env:
          GH_TOKEN: ${{ github.token }}   # 匿名调 api.github.com 会被限流 403，用 gh 带 token
        run: |
          set -eu
          cd "$RUNNER_TEMP"
          # 完整解压：ffdec.jar 依赖压缩包里的 lib/*.jar，不能单抠 jar（java -jar 会 NoClassDefFound）
          gh release download version26.5.0 --repo jindrapetrik/jpexs-decompiler --pattern 'ffdec_[0-9]*.zip' --clobber
          zipfile=$(ls ffdec_[0-9]*.zip | head -1)
          unzip -q -o "$zipfile" -d ffdec
          if [ -f ffdec/ffdec.sh ]; then
            chmod +x ffdec/ffdec.sh
            echo "FFDEC_CMD=$RUNNER_TEMP/ffdec/ffdec.sh" >> "$GITHUB_ENV"
          else
            [ -f ffdec/ffdec.jar ] || { echo "压缩包里没有 ffdec.jar"; exit 1; }
            echo "FFDEC_CMD=java -cp $RUNNER_TEMP/ffdec/ffdec.jar:$RUNNER_TEMP/ffdec/lib/* com.jpexs.decompiler.flash.gui.Main" >> "$GITHUB_ENV"
          fi

      - name: 反编译主代码 swf
        run: bash scripts/decompile-legacy.sh

      - name: 生成资产清单
        run: python3 scripts/swf-inventory.py

      - name: 提交（有变化时）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add legacy/decompiled spec/swf-inventory.json
          if git diff --cached --quiet; then
            echo "反编译产物无变化"
          else
            git commit -m "legacy: 反编译主代码 swf + 资产清单 [skip ci]"
            git push
          fi
