# html5 构建与冒烟，全部在 GitHub 上完成（重操作不进编排器容器）。
#
#   web-build   Linux：haxe + openfl 构建 html5，产物上传
#   web-smoke   Linux：无头浏览器加载构建产物，确认能渲染、无报错、冒烟标记出现
#
# 这两个 job 是流水线等待的检查（pipeline.yaml 的 required_checks）。
# 首次跑通（H1）后：把 haxelib 解析出的版本组写进 openfl-farm-docs 决策页，
# 并在此处和 .orchestrator/agent.Dockerfile 显式锁同一组。
name: web

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 安装 haxe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends haxe

      - name: 缓存 haxelib
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: haxelib-${{ runner.os }}-${{ hashFiles('.github/workflows/web.yml') }}

      - name: 同步资产副本（assets/legacy/ 不入库，构建时生成）
        run: bash scripts/sync-legacy-assets.sh

      - name: 安装依赖并构建 html5
        run: |
          haxelib setup "$HOME/haxelib"   # 注意 ~/.haxelib 是 haxelib 的配置文件路径，不能当仓库
          # 版本组锁定（2026-11-16 CI 实测跑通；与 android.yml、agent.Dockerfile 保持一致）
          haxelib install lime 8.3.2
          haxelib install openfl 9.5.2
          haxelib install swf 3.4.0
          haxelib install utest 1.13.2
          haxelib list
          haxelib run openfl build html5

      - name: 单元测试（与编排器 preflight 同一条命令，main 上必须绿）
        run: haxe test.hxml

      - name: 记录版本组（写进日志，H1 定版本用）
        run: haxelib list

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: export/html5/bin/
          retention-days: 7

  web-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: web-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: export/html5/bin

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装无头浏览器
        working-directory: harness
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      # H3：拉起旧 PHP 后端（legacy/snapshot/ 快照在时才起，约 3-5 分钟）。
      # V2 起页面要向 xml.php 要 config，smoke.mjs 据此把 *.php 代理到后端
      # （页面与后端同源，游戏相对 URL 不用改）。快照未提供 → 按无后端模式跑
      # （V1 探针页不受影响），V2 的 issue 在快照落地前不开跑。
      - name: 拉起旧后端（快照在时）
        run: |
          set +e
          bash ci/legacy-backend-up.sh
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "LEGACY_BACKEND_URL=http://127.0.0.1:8089" >> "$GITHUB_ENV"
          elif [ "$rc" -eq 3 ]; then
            echo "::notice::legacy/snapshot 快照未提供，冒烟按无后端模式跑"
          else
            exit "$rc"
          fi

      - name: 冒烟测试
        working-directory: harness
        env:
          LEGACY_BACKEND_URL: ${{ env.LEGACY_BACKEND_URL }}
        run: node smoke.mjs ../export/html5/bin/index.html
