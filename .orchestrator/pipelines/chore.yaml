# pipeline:chore —— 脚手架、依赖、配置、探路这类写不出失败测试的改动。
# V1（swf 资产通道探路）走这条。
version: 1
base: main
agent_dockerfile: agent.Dockerfile
required_checks: [web-build, web-smoke]
protected:
  - legacy/
  - spec/
  - checks/
  - scripts/
  - harness/
  - ci/
  - .github/
  - "*.md"
  - Project.xml
  - "*.hxml"
generated:
  paths: ["assets/legacy/"]
  how: "把要引用的资产路径加进 assets/legacy-assets.txt，然后运行 bash scripts/sync-legacy-assets.sh"
  cmd: "bash scripts/sync-legacy-assets.sh"
suites:
  manifest: { cmd: "bash checks/manifest-valid.sh", timeout: 2m }
  compile: { cmd: "haxelib run openfl build html5", timeout: 10m }
  test: { cmd: "haxe test.hxml", timeout: 5m }
preflight: [manifest, compile, test]
budget: { max_runs: 15, max_time: 6h }   # ≥ 4 attempts × 120m 的最坏情况（2026-11-21 与 turn 上限配套调）
stages:
  - id: implement
    kind: agent
    model: strong
    prompt: prompts/chore.md
    # 300/120m（2026-11-21）：V1 在旧值 160/60m 内过，但上限只在撞到时才有
    # 意义——#10（android config 接线）起无人值守连跑，等撞 error_max_turns
    # 再调就白烧一轮（#7 教训）。chore 本分内还是小任务，300 不是放任失控
    # （远低于默认流水线 implement 的 1000，那个是 cheap 模型整模块翻译）。
    max_turns: 300
    timeout: 120m
    verify: [compile, test]
    ci: true
    attempts: 4
    escalate: { after: 2, models: [strong2] }
  - id: review
    kind: review
    model: judge
    prompt: prompts/review-chore.md
    # 和 implement 的 CI 等待并行（对齐 #224，默认流水线 review-impl 的做法）：
    # chore 的 implement 也开 PR 等 web-build/web-smoke，review 干等同样的
    # 6-7 分钟纯串行浪费。CI 红时这轮审核作废（不算驳回），chore 的 CI 面
    # 小（src/+资产清单），绿面大。
    during_verify: true
    max_turns: 100
    on_reject: implement
    max_rejects: 4
    escalate: { after: 2, models: [judge2] }
  - id: merge
    kind: merge
    method: squash
    max_changed_lines: 1000
    max_changed_files: 30
    # 同模型审核放行（用户决定 2026-11-17）：单模型 API 下 distinct reviewer 永远
    # 过不了。审查仍是独立会话 + 独立 judge 提示词。
    require_distinct_reviewer: false
    allowed_paths:
      - src/
      - assets/legacy-assets.txt
      - libraries.xml
      - test/
      - tools/
